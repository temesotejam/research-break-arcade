<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111a"><title>Living Frontier</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#07111a;color:#eaf6ff;font-family:system-ui,sans-serif}.app{max-width:1240px;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.k{font-size:11px;letter-spacing:.16em;color:#6edcf4;font-weight:800}h1{font-size:clamp(26px,4vw,44px);margin:3px 0}.desc{max-width:720px;color:#91abba;margin:0;line-height:1.5}.ctrl{display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #29485c;background:#0d1d29;color:#eaf6ff;border-radius:9px;padding:10px 12px;font-weight:750;cursor:pointer}button.on{background:#164054;border-color:#69d9ef}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.card{border:1px solid #1f3748;background:#0a1823;border-radius:14px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #1d3546;flex-wrap:wrap}.badges{display:flex;gap:7px;flex-wrap:wrap}.b{font-size:11px;border:1px solid #29475b;background:#102536;border-radius:999px;padding:5px 8px;color:#cce9f5}canvas{width:100%;height:auto;display:block;background:#06131c}.legend{padding:8px 12px;border-top:1px solid #1d3546;color:#7697aa;font-size:11px}.side h2{font-size:12px;letter-spacing:.1em;color:#bdd7e4;margin:0}.sec{padding:12px;border-bottom:1px solid #183040}.era{font-size:20px;font-weight:850;margin-top:4px}.muted{color:#7898aa;font-size:12px;line-height:1.4}.row{display:grid;grid-template-columns:13px 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:12px}.dot{width:10px;height:10px;border-radius:2px}.bar{height:4px;background:#122838;border-radius:9px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%}.feed{padding:5px 12px 12px;max-height:360px;overflow:auto}.ev{padding:7px 0;border-bottom:1px solid #152b39;font-size:12px;line-height:1.4}.ev small{display:block;color:#527387}.note{padding:10px 12px;color:#5e8196;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:1fr}.feed{max-height:240px}}@media(max-width:540px){body{padding:8px}button{min-height:44px}.desc{font-size:13px}}
</style></head><body><main class="app"><div class="top"><div><div class="k">RESEARCH BREAK ARCADE / AUTO SIM</div><h1>Living Frontier</h1><p class="desc">何もしなくても始まり、探索・交易・研究・防衛・襲撃が勝手に進みます。季節と事件で有利な戦略が変わるので、同じ展開になりにくい観戦型ゲームです。</p></div><div class="ctrl"><button id="pause">PAUSE</button><button class="sp on" data-s="1">1×</button><button class="sp" data-s="2">2×</button><button class="sp" data-s="4">4×</button><button id="new">NEW WORLD</button></div></div><div class="grid"><section class="card"><div class="head"><div class="badges"><span class="b" id="year">YEAR 1</span><span class="b" id="season">穏やかな季節</span><span class="b" id="pop">POP 0</span></div><span class="b" id="news">世界生成中…</span></div><canvas id="c" width="960" height="600"></canvas><div class="legend">● 首都　□ 資源拠点　• 探索隊 / 交易隊 / 襲撃隊　　※操作なしで進行します</div></section><aside class="card side"><div class="sec"><h2>CURRENT ERA</h2><div class="era" id="era">黎明期</div><div class="muted" id="eraText">小さな勢力が互いを探り始める。</div></div><div class="sec"><h2>POWER BALANCE</h2><div id="rank"></div></div><div class="sec"><h2>CHRONICLE</h2></div><div class="feed" id="feed"></div><div class="note">繁栄しすぎた勢力には内乱や資源不足が起こりやすく、弱小勢力には救済イベントも発生します。</div></aside></div></main><script>
(function(){'use strict';var c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;var C=['#63d8ff','#ffb65f','#c99aff','#6fe38f','#ff7c9d','#ffe16a'];var N=['ASTER','VELA','MORROW','HELIX','NACRE','SOLUM'];var T=[['交易商',1.7,.4,.9],['開拓者',.7,.8,1.7],['学究派',.8,.3,.8],['要塞派',.5,.8,1.3],['遊撃派',.5,1.7,.7],['調停派',1.4,.2,1]];var S=[['穏やかな季節',1.2,1,1],['太陽風',.9,1.7,1.2],['霧の季節',1,.85,.75],['実りの季節',1.7,1,1],['磁気嵐',.9,.6,.85],['彗星夜',1,1.1,1.05]];var E=[['黎明期','小さな勢力が互いを探り始める。'],['航路時代','交易路がつながり、富が偏り始める。'],['要塞時代','前哨基地と防衛線が世界を分ける。'],['発見時代','遺物と研究競争が勢力図を揺らす。'],['群雄時代','同盟と裏切りが頻発する。']];var st,paused=false,speed=1,last=performance.now(),acc=0;
function R(a,b){return (b||0)+Math.random()*(a-(b||0))}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function P(a){return a[Math.floor(Math.random()*a.length)]}function CL(v,a,b){return Math.max(a,Math.min(b,v))}function rgba(h,a){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return 'rgba('+r+','+g+','+b+','+a+')'}
function init(){var q=[[120,110],[480,80],[840,125],[135,485],[485,520],[835,470]],i,j;st={t:0,season:0,sc:0,era:0,ec:0,f:[],sites:[],u:[],rel:[],log:[]};for(i=0;i<6;i++){st.f.push({id:i,n:N[i],col:C[i],x:q[i][0],y:q[i][1],pop:R(39,28),food:R(78,55),en:R(68,46),tech:R(8,2),army:R(28,17),m:R(74,55),next:R(4,1),alive:true,t:T[i].slice(),plan:T[i][0]});st.rel[i]=[];for(j=0;j<6;j++)st.rel[i][j]=i===j?100:R(40,6)}for(i=0;i<22;i++)st.sites.push(site(i));paused=false;document.getElementById('pause').textContent='PAUSE';log('新しい世界が誕生。6勢力が自律行動を開始。');ui()}
function site(id){var p;do{p={x:R(W-80,80),y:R(H-80,80)}}while(st&&st.f.some(function(f){return D(p,f)<80}));return{id:id,x:p.x,y:p.y,type:Math.random()<.18?'relic':Math.random()<.5?'food':'energy',owner:null,l:1+Math.floor(Math.random()*3)}}
function log(s){st.log.unshift({t:st.t,s:s});st.log=st.log.slice(0,24);document.getElementById('news').textContent=s.length>42?s.slice(0,41)+'…':s}
function rel(a,b,v){st.rel[a.id][b.id]=CL(st.rel[a.id][b.id]+v,-100,100);st.rel[b.id][a.id]=st.rel[a.id][b.id]}
function nearSite(f,fn){var b=null,d=1e9;st.sites.forEach(function(s){var q=D(f,s);if((!fn||fn(s))&&q<d){d=q;b=s}});return b}function nearF(f,fn){var b=null,d=1e9;st.f.forEach(function(o){var q;if(o!==f&&o.alive&&(!fn||fn(o))){q=D(f,o);if(q<d){d=q;b=o}}});return b}
function send(f,t,type){if(!t)return;st.u.push({f:f.id,t:t,type:type,x:f.x,y:f.y,tx:t.x,ty:t.y,life:0})}
function act(f){var neutral=nearSite(f,function(s){return s.owner===null}),friend=nearF(f,function(o){return st.rel[f.id][o.id]>25}),rival=nearF(f,function(o){return st.rel[f.id][o.id]<0}),r=Math.random(),tr=f.t;if(neutral&&r<.28*tr[3]){send(f,neutral,'claim');f.en-=3}else if(friend&&r<.28*tr[1]){send(f,friend,'trade');f.en-=2}else if(rival&&r<.22*tr[2]&&f.army>14){send(f,rival,'raid');f.en-=4}else if(r<.78){f.tech+=R(1.8,.4);f.en-=3;if(Math.random()<.2)log(f.n+' が研究成果を獲得。')}else{f.army+=R(2,.5);f.m+=1}f.next=R(5.5,2.3)/S[st.season][3]}
function hit(u){var f=st.f[u.f],t=u.t;if(!f||!f.alive)return;if(u.type==='claim'){if(t.owner===null){t.owner=f.id;f.m+=3;log(f.n+' が新しい'+(t.type==='relic'?'遺物':'資源')+'拠点を確保。')}else if(t.owner!==f.id){var o=st.f[t.owner],a=f.army*R(1.3,.6)+f.tech,b=o.army*R(1.2,.6)+o.tech+12;rel(f,o,-14);if(a>b){t.owner=f.id;f.m+=4;o.m-=4;log(f.n+' が '+o.n+' の拠点を奪取。')}else{f.m-=3;o.m+=2;log(o.n+' が '+f.n+' の進出を阻止。')}}}else if(u.type==='trade'){if(t.alive){f.food-=5;t.food+=8;f.en+=6;t.en+=3;rel(f,t,9);log(f.n+' と '+t.n+' の交易路が活発化。')}}else if(u.type==='raid'){if(t.alive){var aa=f.army*R(1.25,.55)+f.tech*.6,bb=t.army*R(1.25,.55)+t.tech*.6+8;rel(f,t,-20);f.army-=R(4,1);t.army-=R(4,1);if(aa>bb){var z=Math.min(24,t.en*.25+5);t.en-=z;f.en+=z;t.pop-=R(4,1);f.m+=4;t.m-=6;log(f.n+' が '+t.n+' への襲撃に成功。')}else{f.m-=3;t.m+=3;log(t.n+' が '+f.n+' の襲撃を撃退。')}}}}
function units(dt){for(var i=st.u.length-1;i>=0;i--){var u=st.u[i],dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy),v=52*S[st.season][3]*dt;u.life+=dt;if(d<v+2){hit(u);st.u.splice(i,1)}else{u.x+=dx/d*v;u.y+=dy/d*v;if(u.life>22)st.u.splice(i,1)}}}
function event(){var live=st.f.filter(function(f){return f.alive}),f=P(live),r=Math.random(),a,b,s;if(!f)return;if(r<.14){f.pop+=R(12,4);f.m+=7;log(f.n+' で祝祭。人口と士気が上昇。')}else if(r<.27){s=P(st.sites);s.owner=null;log('流星雨で前哨地が1つ無人化。')}else if(r<.4){a=P(live);b=P(live.filter(function(q){return q!==a}));if(b){rel(a,b,24);log(a.n+' と '+b.n+' が休戦協定。')}}else if(r<.52){a=live.slice().sort(function(p,q){return power(q)-power(p)})[0];a.pop-=R(8,2);a.m-=14;a.t[2]*=.88;a.t[1]*=1.08;log(a.n+' で内乱。最大勢力の方針が変化。')}else if(r<.65){s=P(st.sites.filter(function(q){return q.type==='relic'&&q.owner!==null}));if(s){a=st.f[s.owner];a.tech+=R(9,3);log(a.n+' が遺物解析に成功。技術が急伸。')}}else if(r<.78){a=live.slice().sort(function(p,q){return power(p)-power(q)})[0];a.food+=25;a.en+=20;a.m+=8;log(a.n+' に中立商隊が到着。弱小勢力が復活。')}else if(r<.9){live.forEach(function(q){q.en=Math.max(0,q.en-R(12,3))});log('大規模磁気嵐。全勢力の遠征能力が低下。')}else{s=site(st.sites.length);s.type='relic';st.sites.push(s);log('未知の遺物が出現。各勢力が反応。')}}
function econ(dt){var se=S[st.season];st.f.forEach(function(f){if(!f.alive)return;var own=st.sites.filter(function(s){return s.owner===f.id}),fs=own.filter(function(s){return s.type==='food'}).length,es=own.filter(function(s){return s.type==='energy'}).length,rs=own.filter(function(s){return s.type==='relic'}).length;f.food+=dt*(1.1+fs*.9)*se[1];f.en+=dt*(1+es*.8)*se[2];f.tech+=dt*(.05+rs*.05);f.food-=dt*f.pop*.013;f.en-=dt*(own.length*.02+f.army*.004);if(f.food>38&&f.m>25)f.pop+=dt*(.17+fs*.03);if(f.food<7){f.pop-=dt*.7;f.m-=dt}else f.m+=dt*.04;if(f.en>48)f.army+=dt*.1;f.pop=CL(f.pop,0,180);f.food=CL(f.food,0,200);f.en=CL(f.en,0,180);f.army=CL(f.army,0,140);f.m=CL(f.m,0,100);f.next-=dt;if(f.next<=0)act(f);if(f.pop<3){f.alive=false;st.sites.forEach(function(s){if(s.owner===f.id)s.owner=null});log(f.n+' が崩壊。領土は中立化。')}})}
function sim(dt){st.t+=dt;st.sc+=dt;st.ec+=dt;econ(dt);units(dt);if(st.sc>19){st.sc=0;st.season=(st.season+1)%S.length;log('季節が「'+S[st.season][0]+'」へ変化。')}if(st.ec>65&&st.era<E.length-1){st.ec=0;st.era++;st.f.forEach(function(f){if(Math.random()<.5){f.t[1]*=1.1;f.plan='商路拡張'}else{f.t[3]*=1.1;f.plan='領土拡張'}});log('世界は「'+E[st.era][0]+'」へ移行。')}if(Math.random()<dt*(.035+st.era*.007))event()}
function power(f){return f.pop*1.35+f.army+f.tech*1.8+st.sites.filter(function(s){return s.owner===f.id}).length*13+f.m*.25}
function ui(){var live=st.f.filter(function(f){return f.alive}),so=live.slice().sort(function(a,b){return power(b)-power(a)}),mx=Math.max.apply(null,[1].concat(so.map(power)));document.getElementById('year').textContent='YEAR '+(1+Math.floor(st.t/42));document.getElementById('season').textContent=S[st.season][0];document.getElementById('pop').textContent='POP '+Math.round(live.reduce(function(a,f){return a+f.pop},0));document.getElementById('era').textContent=E[st.era][0];document.getElementById('eraText').textContent=E[st.era][1];document.getElementById('rank').innerHTML=so.map(function(f,i){return '<div class="row"><span class="dot" style="background:'+f.col+'"></span><div><b>'+(i+1)+'. '+f.n+'</b> <span class="muted">'+f.plan+'</span><div class="bar"><i style="width:'+Math.round(power(f)/mx*100)+'%;background:'+f.col+'"></i></div></div><b>'+Math.round(power(f))+'</b></div>'}).join('');document.getElementById('feed').innerHTML=st.log.map(function(e){return '<div class="ev"><small>T+'+Math.floor(e.t)+'s</small>'+e.s+'</div>'}).join('')}
function draw(){x.fillStyle='#06131c';x.fillRect(0,0,W,H);x.strokeStyle='rgba(90,140,165,.08)';for(var gx=0;gx<W;gx+=48){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(var gy=0;gy<H;gy+=48){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}st.f.forEach(function(f){if(!f.alive)return;st.sites.forEach(function(s){if(s.owner===f.id){x.strokeStyle=rgba(f.col,.08);x.beginPath();x.moveTo(f.x,f.y);x.lineTo(s.x,s.y);x.stroke()}})});st.sites.forEach(function(s){var o=s.owner===null?null:st.f[s.owner];x.fillStyle=o?rgba(o.col,.2):'rgba(150,190,210,.08)';x.strokeStyle=o?rgba(o.col,.75):'rgba(150,190,210,.32)';x.fillRect(s.x-8,s.y-8,16,16);x.strokeRect(s.x-8,s.y-8,16,16);x.fillStyle=s.type==='food'?'#8be090':s.type==='energy'?'#75ddff':'#dec0ff';x.beginPath();x.arc(s.x,s.y,3+(s.l||1),0,7);x.fill()});st.f.forEach(function(f){if(!f.alive)return;x.fillStyle=rgba(f.col,.15);x.strokeStyle=f.col;x.lineWidth=2;x.beginPath();x.arc(f.x,f.y,23,0,7);x.fill();x.stroke();x.fillStyle=f.col;x.beginPath();x.arc(f.x,f.y,8,0,7);x.fill();x.fillStyle='#e7f8ff';x.font='700 11px system-ui';x.textAlign='center';x.fillText(f.n,f.x,f.y-31);x.fillStyle='#7293a6';x.font='10px system-ui';x.fillText(f.plan,f.x,f.y+39)});st.u.forEach(function(u){var f=st.f[u.f];x.fillStyle=u.type==='raid'?'#ff7899':u.type==='trade'?'#79e4c3':f.col;x.beginPath();x.arc(u.x,u.y,u.type==='raid'?4:3.2,0,7);x.fill()});var lead=st.f.filter(function(f){return f.alive}).sort(function(a,b){return power(b)-power(a)})[0];if(lead){x.fillStyle='rgba(3,9,14,.72)';x.fillRect(12,12,190,45);x.fillStyle='#789bac';x.font='10px system-ui';x.textAlign='left';x.fillText('CURRENT LEADER',23,29);x.fillStyle=lead.col;x.font='800 16px system-ui';x.fillText(lead.n+'  '+Math.round(power(lead)),23,48)}}
function frame(n){var d=Math.min(.05,(n-last)/1000);last=n;if(!paused){acc+=d*speed;while(acc>1/60){sim(1/60);acc-=1/60}}draw();if(Math.floor(st.t*3)!==frame.z){frame.z=Math.floor(st.t*3);ui()}requestAnimationFrame(frame)}
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'RESUME':'PAUSE'};document.getElementById('new').onclick=init;Array.prototype.forEach.call(document.querySelectorAll('.sp'),function(b){b.onclick=function(){speed=Number(b.getAttribute('data-s'));Array.prototype.forEach.call(document.querySelectorAll('.sp'),function(q){q.classList.toggle('on',q===b)})}});init();requestAnimationFrame(frame)})();
</script></body></html>
